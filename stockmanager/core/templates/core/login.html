{% extends 'core/auth_base.html' %}
{% load static %}

{% block title %}Login - UNICASH{% endblock %}

{% block extra_css %}
<style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
    }
    .login-container {
        background-color: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }
    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .login-header h1 {
        color: #0d6efd;
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }
    .form-floating {
        margin-bottom: 1rem;
    }
    .btn-login {
        width: 100%;
        padding: 0.8rem;
        font-size: 1.1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container">
        <div class="login-header">
            <h1>UNICASH</h1>
            <p class="text-muted">Sistema de Gerenciamento de Estoque</p>
        </div>
        <form id="loginForm">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Nome de usuário" required>
                <label for="username">Nome de usuário</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                <label for="password">Senha</label>
            </div>
            <button type="submit" class="btn btn-primary btn-login">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
