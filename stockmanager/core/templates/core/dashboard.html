<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Unichash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .feature-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .feature-card:hover {
            transform: translateY(-5px);
        }
        .feature-icon {
            font-size: 2rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Unichash</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/dashboard/">Painel de Controle</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4">Bem-vindo ao Sistema de Gerenciamento</h2>
        
        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="card feature-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-box feature-icon"></i>
                        <h5 class="card-title">Produtos</h5>
                        <p class="card-text">Gerencie seu catálogo de produtos</p>
                        <a href="/products/" class="btn btn-primary">Acessar</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 col-lg-3">
                <div class="card feature-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-users feature-icon"></i>
                        <h5 class="card-title">Clientes</h5>
                        <p class="card-text">Gerencie seus clientes</p>
                        <a href="/customers/" class="btn btn-primary">Acessar</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 col-lg-3">
                <div class="card feature-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-warehouse feature-icon"></i>
                        <h5 class="card-title">Estoque</h5>
                        <p class="card-text">Controle seu estoque</p>
                        <a href="/inventory/" class="btn btn-primary">Acessar</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 col-lg-3">
                <div class="card feature-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-shopping-cart feature-icon"></i>
                        <h5 class="card-title">Vendas</h5>
                        <p class="card-text">Gerencie suas vendas</p>
                        <a href="/sales/" class="btn btn-primary">Acessar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login/';
        });

        // Check for authentication
        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            window.location.href = '/login/';
            return;
        }

        // Function to refresh token
        async function refreshToken() {
            const refreshToken = localStorage.getItem('refresh_token');
            try {
                const response = await fetch('/api/token/refresh/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refresh: refreshToken })
                });
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access);
                    return data.access;
                }
                throw new Error('Token refresh failed');
            } catch (error) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login/';
            }
        }

        // Verify token validity
        async function verifyToken() {
            try {
                const response = await fetch('/api/token/verify/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: accessToken })
                });
                
                if (!response.ok) {
                    // Try to refresh token
                    const newToken = await refreshToken();
                    if (!newToken) {
                        throw new Error('Token refresh failed');
                    }
                }
            } catch (error) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login/';
            }
        }

        // Initial token verification
        verifyToken();
    </script>
</body>
</html>
